name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        component: [qt, netsim, graphics, firmware]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install component build dependencies
        env:
          COMPONENT: ${{ matrix.component }}
        run: sudo bash ci/host-deps.sh "$COMPONENT"

      - name: Build component
        env:
          COMPONENT: ${{ matrix.component }}
        run: make "$COMPONENT" PYTHON=python JOBS="$(nproc)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-component-${{ matrix.component }}
          path: out/components/${{ matrix.component }}.tar.zst
          compression-level: 0
          if-no-files-found: error

  package:
    needs: components
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulator-component-*
          path: out/components
          merge-multiple: true

      - name: Install emulator build dependencies
        run: sudo bash ci/host-deps.sh package

      - name: Build and package the emulator
        run: make package PYTHON=python JOBS="$(nproc)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aosstudio-emulator-linux-x86_64
          path: out/dist/aosstudio-emulator-*-linux-x86_64.zip
          compression-level: 0
          if-no-files-found: error

  verify:
    needs: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aosstudio-emulator-linux-x86_64
          path: out/dist

      - name: Install host verification dependencies
        run: sudo bash ci/host-deps.sh verify

      - name: Install the emulator and boot the guest kernel
        run: make verify PYTHON=python

  publish:
    needs: verify
    # if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: nightly-release
    steps:
      - name: Download the verified emulator archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aosstudio-emulator-linux-x86_64
          path: out/dist

      - name: Publish nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(out/dist/aosstudio-emulator-*-linux-x86_64.zip)
          test "${#assets[@]}" -eq 1
          test -s "${assets[0]}"

          tag=latest
          ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" \
            --jq '.[] | select(.ref == "refs/tags/latest") | .ref')
          if [[ -n "$ref" ]]; then
            gh api --silent --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
              -f "sha=$GITHUB_SHA" -F force=true
          else
            gh api --silent --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false --prerelease --latest=false \
              --title 'Nightly build' --notes ''
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --prerelease --latest=false \
              --title 'Nightly build' --notes ''
          fi
