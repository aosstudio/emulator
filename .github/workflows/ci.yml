name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install source check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          python -m pip install --only-binary=:all: --require-hashes -r ci/lint-requirements.txt

      - name: Check sources
        run: make check PYTHON=python

      - name: Diagnose boot of the existing emulator build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45941587140 --repo "$GITHUB_REPOSITORY" --name aosstudio-emulator-linux-x86_64 --dir out/dist
          sudo bash ci/host-deps.sh verify
          make verify PYTHON=python
